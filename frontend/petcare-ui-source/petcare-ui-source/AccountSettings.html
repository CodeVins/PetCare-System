<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계정 설정</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}

* { box-sizing: border-box; }
</style>
</head>
<body>
<div style="width:390px;height:900px;box-sizing:border-box;background:#FAFAF9;color:#1C1917;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;">
<div style="height:56px;flex-shrink:0;"><header style="width:390px;height:56px;box-sizing:border-box;background:#ffffff;border-bottom:1px solid #E7E5E4;display:flex;align-items:center;gap:4px;padding:0 16px 0 8px;font-family:'Noto Sans KR',sans-serif;color:#1C1917;">
<button type="button" aria-label="뒤로 가기" style="width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:#292524;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<h1 style="margin:0;font-size:18px;font-weight:700;line-height:1.3;">계정 설정</h1>
</header></div>
<main style="flex-grow:1;padding:20px 16px;display:flex;flex-direction:column;gap:16px;">
<section aria-labelledby="ac-mail" style="padding:16px;background:#ffffff;border:1px solid #E7E5E4;border-radius:16px;box-shadow:0 1px 3px rgba(13,79,72,0.08);display:flex;flex-direction:column;gap:12px;">
<h2 id="ac-mail" style="margin:0;font-size:17px;font-weight:700;">이메일 변경</h2>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="ac-email" style="font-size:14px;font-weight:500;">새 이메일</label>
<input id="ac-email" type="email" value="user@example.com" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<p style="margin:0;font-size:13px;color:#57534E;">이메일을 바꾸면 다시 로그인해야 할 수 있어요.</p>
<button type="button" style="height:48px;border:0;border-radius:999px;background:#0F766E;color:#ffffff;font-family:inherit;font-size:15px;font-weight:700;">이메일 변경</button>
</section>
<section aria-labelledby="ac-pw" style="padding:16px;background:#ffffff;border:1px solid #E7E5E4;border-radius:16px;box-shadow:0 1px 3px rgba(13,79,72,0.08);display:flex;flex-direction:column;gap:12px;">
<h2 id="ac-pw" style="margin:0;font-size:17px;font-weight:700;">비밀번호 변경</h2>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="ac-cur" style="font-size:14px;font-weight:500;">현재 비밀번호</label>
<input id="ac-cur" type="password" value="password1" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="ac-new" style="font-size:14px;font-weight:500;">새 비밀번호</label>
<input id="ac-new" type="password" placeholder="새 비밀번호를 입력하세요" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="ac-cf" style="font-size:14px;font-weight:500;">새 비밀번호 확인</label>
<input id="ac-cf" type="password" placeholder="한 번 더 입력하세요" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<button type="button" style="height:48px;border:0;border-radius:999px;background:#0F766E;color:#ffffff;font-family:inherit;font-size:15px;font-weight:700;">비밀번호 변경</button>
</section>
</main>
</div>
</body>
</html>
