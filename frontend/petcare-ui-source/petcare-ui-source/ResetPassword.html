<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>새 비밀번호 설정</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}

* { box-sizing: border-box; }
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FAFAF9;color:#1C1917;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;">
<main style="flex-grow:1;padding:72px 24px 32px;display:flex;flex-direction:column;gap:28px;">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;color:#0F766E;text-align:center;">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="17.5" cy="10" r="1.8"/><path d="M12 11.5c-2.7 0-5 2.6-5 4.7 0 1.5 1.2 2.3 2.6 2.3 1 0 1.5-.4 2.4-.4s1.4.4 2.4.4c1.4 0 2.6-.8 2.6-2.3 0-2.1-2.3-4.7-5-4.7z"/></svg>
<h1 style="margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:36px;line-height:1.15;">새 비밀번호 설정</h1>
<p style="margin:0;font-size:15px;color:#57534E;">새로 사용할 비밀번호를 입력해 주세요</p>
</div>
<form style="display:flex;flex-direction:column;gap:16px;">
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="rp-token" style="font-size:14px;font-weight:500;">재설정 토큰</label>
<input id="rp-token" type="text" value="a1b2c3d4-e5f6" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="rp-new" style="font-size:14px;font-weight:500;">새 비밀번호</label>
<input id="rp-new" type="password" placeholder="새 비밀번호를 입력하세요" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="rp-cf" style="font-size:14px;font-weight:500;">새 비밀번호 확인</label>
<input id="rp-cf" type="password" placeholder="한 번 더 입력하세요" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<button type="button" style="height:52px;margin-top:8px;border:0;border-radius:999px;background:#0F766E;color:#ffffff;font-family:inherit;font-size:16px;font-weight:700;box-shadow:0 2px 6px rgba(13,79,72,0.25);">비밀번호 변경</button>
</form>
</main>
</div>
</body>
</html>
