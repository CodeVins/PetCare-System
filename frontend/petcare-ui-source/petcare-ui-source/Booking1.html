<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FAFAF9;color:#1C1917;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;">
<div style="height:56px;flex-shrink:0;"><header style="width:390px;height:56px;box-sizing:border-box;background:#ffffff;border-bottom:1px solid #E7E5E4;display:flex;align-items:center;gap:4px;padding:0 16px 0 8px;font-family:'Noto Sans KR',sans-serif;color:#1C1917;">
<button type="button" aria-label="뒤로 가기" style="width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:#292524;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<h1 style="margin:0;font-size:18px;font-weight:700;line-height:1.3;">예약하기</h1>
</header></div>
<main style="flex-grow:1;padding:20px 16px;display:flex;flex-direction:column;gap:20px;">
<div role="group" aria-label="3단계 중 1단계" style="display:flex;align-items:center;">
<div style="display:flex;align-items:center;gap:8px;">
<span style="width:28px;height:28px;border-radius:999px;background:#0F766E;color:#ffffff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;">1</span>
<span style="font-size:13px;font-weight:700;color:#0F766E;">반려동물</span>
</div>
<div style="flex:1;height:2px;margin:0 8px;background:#D6D3D1;"></div>
<div style="display:flex;align-items:center;gap:8px;">
<span style="width:28px;height:28px;box-sizing:border-box;border-radius:999px;border:2px solid #D6D3D1;color:#57534E;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;">2</span>
<span style="font-size:13px;color:#57534E;">날짜·시간</span>
</div>
<div style="flex:1;height:2px;margin:0 8px;background:#D6D3D1;"></div>
<div style="display:flex;align-items:center;gap:8px;">
<span style="width:28px;height:28px;box-sizing:border-box;border-radius:999px;border:2px solid #D6D3D1;color:#57534E;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;">3</span>
<span style="font-size:13px;color:#57534E;">확인</span>
</div>
</div>
<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F0FDFA;border-radius:12px;color:#115E59;font-size:14px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2.5"/><path d="M12 8.5v6M9 11.5h6"/><path d="M10 21v-3.5h4V21"/></svg>

<h2 style="margin:0;font-size:20px;font-weight:700;line-height:1.35;">어떤 반려동물이 진료를 받나요?</h2>
<div role="radiogroup" aria-label="반려동물 선택" style="display:flex;flex-direction:column;gap:10px;">
<label style="display:flex;align-items:center;gap:14px;padding:14px 16px;background:#F0FDFA;border:2px solid #0F766E;border-radius:16px;">
<span style="width:56px;height:56px;flex-shrink:0;border-radius:999px;background:#CCFBF1;color:#0F766E;display:flex;align-items:center;justify-content:center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="17.5" cy="10" r="1.8"/><path d="M12 11.5c-2.7 0-5 2.6-5 4.7 0 1.5 1.2 2.3 2.6 2.3 1 0 1.5-.4 2.4-.4s1.4.4 2.4.4c1.4 0 2.6-.8 2.6-2.3 0-2.1-2.3-4.7-5-4.7z"/></svg></span>

</label>
<label style="display:flex;align-items:center;gap:14px;padding:14px 16px;background:#ffffff;border:1px solid #E7E5E4;border-radius:16px;box-shadow:0 1px 3px rgba(13,79,72,0.08);">
<span style="width:56px;height:56px;flex-shrink:0;border-radius:999px;background:#FEF3C7;color:#B45309;display:flex;align-items:center;justify-content:center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="17.5" cy="10" r="1.8"/><path d="M12 11.5c-2.7 0-5 2.6-5 4.7 0 1.5 1.2 2.3 2.6 2.3 1 0 1.5-.4 2.4-.4s1.4.4 2.4.4c1.4 0 2.6-.8 2.6-2.3 0-2.1-2.3-4.7-5-4.7z"/></svg></span>
<span style="flex-grow:1;display:flex;flex-direction:column;"><span style="font-size:17px;font-weight:700;">콩이</span><span style="font-size:13px;color:#57534E;">고양이 · 코리안숏헤어 · 2살</span></span>
<input type="radio" name="pet" value="kongi" style="width:24px;height:24px;margin:0;accent-color:#0F766E;">
</label>
<label style="display:flex;align-items:center;gap:14px;padding:14px 16px;background:#ffffff;border:1px solid #E7E5E4;border-radius:16px;box-shadow:0 1px 3px rgba(13,79,72,0.08);">
<span style="width:56px;height:56px;flex-shrink:0;border-radius:999px;background:#E7E5E4;color:#44403C;display:flex;align-items:center;justify-content:center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="17.5" cy="10" r="1.8"/><path d="M12 11.5c-2.7 0-5 2.6-5 4.7 0 1.5 1.2 2.3 2.6 2.3 1 0 1.5-.4 2.4-.4s1.4.4 2.4.4c1.4 0 2.6-.8 2.6-2.3 0-2.1-2.3-4.7-5-4.7z"/></svg></span>
<span style="flex-grow:1;display:flex;flex-direction:column;"><span style="font-size:17px;font-weight:700;">초코</span><span style="font-size:13px;color:#57534E;">강아지 · 푸들 · 7살</span></span>
