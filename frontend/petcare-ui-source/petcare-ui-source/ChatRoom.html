<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>채팅방</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}

* { box-sizing: border-box; }
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FAFAF9;color:#1C1917;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;">
<div style="height:56px;flex-shrink:0;"><header style="width:390px;height:56px;box-sizing:border-box;background:#ffffff;border-bottom:1px solid #E7E5E4;display:flex;align-items:center;gap:4px;padding:0 16px 0 8px;font-family:'Noto Sans KR',sans-serif;color:#1C1917;">
<button type="button" aria-label="뒤로 가기" style="width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:#292524;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<h1 style="margin:0;font-size:18px;font-weight:700;line-height:1.3;">따뜻한마음 동물병원</h1>
</header></div>
<main style="flex-grow:1;padding:16px;display:flex;flex-direction:column;gap:12px;">
<div style="align-self:center;height:26px;padding:0 12px;border-radius:999px;background:#F5F5F4;color:#57534E;font-size:12px;display:flex;align-items:center;">9월 20일 (일)</div>
<div style="align-self:flex-start;max-width:78%;display:flex;flex-direction:column;gap:2px;">
<div style="padding:10px 14px;border-radius:18px 18px 18px 4px;background:#E7E5E4;color:#1C1917;">안녕하세요, 따뜻한마음 동물병원입니다. 무엇을 도와드릴까요?</div>
<span style="font-size:12px;color:#57534E;padding-left:4px;">오전 10:02</span>
</div>
<div style="align-self:flex-end;max-width:78%;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
<div style="padding:10px 14px;border-radius:18px 18px 4px 18px;background:#0F766E;color:#ffffff;">수요일에 보리 접종 예약을 했는데, 미리 준비할 게 있을까요?</div>
<span style="font-size:12px;color:#57534E;padding-right:4px;">오전 10:05</span>
</div>
<div style="align-self:flex-start;max-width:78%;display:flex;flex-direction:column;gap:2px;">
<div style="padding:10px 14px;border-radius:18px 18px 18px 4px;background:#E7E5E4;color:#1C1917;">특별한 준비는 없어요. 평소 접종 기록만 챙겨서 편하게 오세요.</div>
<span style="font-size:12px;color:#57534E;padding-left:4px;">오전 10:08</span>
</div>
<div style="align-self:flex-end;max-width:78%;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
<div style="padding:10px 14px;border-radius:18px 18px 4px 18px;background:#0F766E;color:#ffffff;">감사합니다! 그럼 수요일에 뵐게요.</div>
<span style="font-size:12px;color:#57534E;padding-right:4px;">오전 10:09</span>
</div>
<div style="align-self:flex-start;max-width:78%;display:flex;flex-direction:column;gap:2px;">
<div style="padding:10px 14px;border-radius:18px 18px 18px 4px;background:#E7E5E4;color:#1C1917;">네, 수요일 오후 2시 30분에 뵙겠습니다.</div>
<span style="font-size:12px;color:#57534E;padding-left:4px;">오전 10:10</span>
</div>
</main>
<form style="flex-shrink:0;box-sizing:border-box;padding:10px 12px 20px;background:#ffffff;border-top:1px solid #E7E5E4;display:flex;align-items:center;gap:8px;">
<label for="cr-msg" style="position:absolute;width:1px;height:1px;overflow:hidden;">메시지 입력</label>
<input id="cr-msg" type="text" placeholder="메시지를 입력하세요" style="flex-grow:1;height:48px;box-sizing:border-box;padding:0 16px;border:1px solid #D6D3D1;border-radius:999px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
<button type="button" aria-label="보내기" style="width:48px;height:48px;flex-shrink:0;border:0;border-radius:999px;background:#0F766E;color:#ffffff;display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
</form>
</div>
</body>
</html>
