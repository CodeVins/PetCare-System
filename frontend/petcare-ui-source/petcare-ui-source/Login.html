<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}

* { box-sizing: border-box; }
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FAFAF9;color:#1C1917;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;">
<main style="flex-grow:1;padding:72px 24px 32px;display:flex;flex-direction:column;gap:28px;">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;color:#0F766E;text-align:center;">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="17.5" cy="10" r="1.8"/><path d="M12 11.5c-2.7 0-5 2.6-5 4.7 0 1.5 1.2 2.3 2.6 2.3 1 0 1.5-.4 2.4-.4s1.4.4 2.4.4c1.4 0 2.6-.8 2.6-2.3 0-2.1-2.3-4.7-5-4.7z"/></svg>
<h1 style="margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:44px;line-height:1.1;">펫케어</h1>
<p style="margin:0;font-size:15px;color:#57534E;">우리 아이 건강을 함께 챙겨요</p>
</div>
<div role="status" style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;background:#DCFCE7;color:#166534;font-size:14px;font-weight:500;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>회원가입이 완료되었어요. 로그인해 주세요.
</div>
<form style="display:flex;flex-direction:column;gap:16px;">
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="lg-email" style="font-size:14px;font-weight:500;">이메일</label>
<input id="lg-email" type="email" placeholder="user@example.com" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="lg-pw" style="font-size:14px;font-weight:500;">비밀번호</label>
<input id="lg-pw" type="password" placeholder="비밀번호를 입력하세요" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<button type="button" style="height:52px;margin-top:8px;border:0;border-radius:999px;background:#0F766E;color:#ffffff;font-family:inherit;font-size:16px;font-weight:700;box-shadow:0 2px 6px rgba(13,79,72,0.25);">로그인</button>
</form>
<div style="display:flex;justify-content:space-between;align-items:center;">
<a href="/ForgotPassword.dc.html" style="min-height:44px;display:flex;align-items:center;color:#57534E;font-size:14px;text-decoration:none;">비밀번호를 잊으셨나요?</a>
<a href="/Signup.dc.html" style="min-height:44px;display:flex;align-items:center;color:#0F766E;font-size:14px;font-weight:700;text-decoration:none;">회원가입</a>
</div>
</main>
</div>
</body>
</html>
