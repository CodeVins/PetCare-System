<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>반려동물 등록</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}

* { box-sizing: border-box; }
</style>
</head>
<body>
<div style="width:390px;height:900px;box-sizing:border-box;background:#FAFAF9;color:#1C1917;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;">
<div style="height:56px;flex-shrink:0;"><header style="width:390px;height:56px;box-sizing:border-box;background:#ffffff;border-bottom:1px solid #E7E5E4;display:flex;align-items:center;gap:4px;padding:0 16px 0 8px;font-family:'Noto Sans KR',sans-serif;color:#1C1917;">
<button type="button" aria-label="뒤로 가기" style="width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:#292524;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<h1 style="margin:0;font-size:18px;font-weight:700;line-height:1.3;">반려동물 등록</h1>
</header></div>
<main style="flex-grow:1;padding:24px 16px;display:flex;flex-direction:column;gap:20px;">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
<span style="width:96px;height:96px;box-sizing:border-box;border-radius:999px;background:#CCFBF1;color:#0F766E;border:2px dashed #0F766E;display:flex;align-items:center;justify-content:center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="17.5" cy="10" r="1.8"/><path d="M12 11.5c-2.7 0-5 2.6-5 4.7 0 1.5 1.2 2.3 2.6 2.3 1 0 1.5-.4 2.4-.4s1.4.4 2.4.4c1.4 0 2.6-.8 2.6-2.3 0-2.1-2.3-4.7-5-4.7z"/></svg></span>
<button type="button" style="height:44px;padding:0 16px;border:0;background:transparent;color:#0F766E;font-family:inherit;font-size:14px;font-weight:700;">사진 추가</button>
<span style="margin-top:-8px;font-size:12px;color:#57534E;">jpg, png, webp 파일만 올릴 수 있어요</span>
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="pf-name" style="font-size:14px;font-weight:500;">이름</label>
<input id="pf-name" type="text" value="보리" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<div role="radiogroup" aria-labelledby="pf-species" style="display:flex;flex-direction:column;gap:8px;">
<span id="pf-species" style="font-size:14px;font-weight:500;">종</span>
<div style="display:flex;gap:8px;">
<button type="button" role="radio" aria-checked="true" style="flex:1;height:48px;border:1.5px solid #0F766E;border-radius:8px;background:#F0FDFA;color:#0F766E;font-family:inherit;font-size:15px;font-weight:700;">강아지</button>
<button type="button" role="radio" aria-checked="false" style="flex:1;height:48px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;color:#292524;font-family:inherit;font-size:15px;font-weight:500;">고양이</button>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="pf-breed" style="font-size:14px;font-weight:500;">품종</label>
<input id="pf-breed" type="text" value="말티즈" style="width:100%;height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<label for="pf-birth" style="font-size:14px;font-weight:500;">생년월일</label>
<div style="position:relative;">
<input id="pf-birth" type="text" value="2023.05.14" style="width:100%;height:48px;box-sizing:border-box;padding:0 44px 0 14px;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;color:#1C1917;">
<span style="position:absolute;right:14px;top:14px;color:#57534E;display:flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span>
</div>
</div>
<div role="radiogroup" aria-labelledby="pf-size" style="display:flex;flex-direction:column;gap:8px;">
<span id="pf-size" style="font-size:14px;font-weight:500;">크기</span>
<div style="display:flex;gap:8px;">
<button type="button" role="radio" aria-checked="true" style="flex:1;height:48px;padding:0;border:1.5px solid #0F766E;border-radius:8px;background:#F0FDFA;color:#0F766E;font-family:inherit;font-size:14px;font-weight:700;">소형</button>
<button type="button" role="radio" aria-checked="false" style="flex:1;height:48px;padding:0;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;color:#292524;font-family:inherit;font-size:14px;font-weight:500;">중형</button>
<button type="button" role="radio" aria-checked="false" style="flex:1;height:48px;padding:0;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;color:#292524;font-family:inherit;font-size:14px;font-weight:500;">대형</button>
<button type="button" role="radio" aria-checked="false" style="flex:1.4;height:48px;padding:0;border:1px solid #D6D3D1;border-radius:8px;background:#ffffff;color:#292524;font-family:inherit;font-size:14px;font-weight:500;">선택 안 함</button>
</div>
</div>
</main>
<div style="flex-shrink:0;box-sizing:border-box;padding:12px 16px 20px;background:#ffffff;border-top:1px solid #E7E5E4;">
<button type="button" style="width:100%;height:52px;border:0;border-radius:999px;background:#0F766E;color:#ffffff;font-family:inherit;font-size:16px;font-weight:700;box-shadow:0 2px 6px rgba(13,79,72,0.25);">등록하기</button>
</div>
</div>
</body>
</html>
