name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

# 변경(2026-09-30): main push 실행을 한 번에 하나씩 — 연속 push 시 build-push가 병렬로 돌아 latest 태그 경쟁
# (이전: 동시 실행 가능, 나중 배포가 이전 커밋 이미지를 받을 수 있었음). PR은 ref가 달라 서로 안 막힘
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# 변경(2026-09-30): 기본 토큰 권한을 읽기 전용으로 — test/deploy는 쓰기 권한 불필요, build-push만 job에서 packages: write
# (이전: 레포 기본 권한을 그대로 받음)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: backend/*.gradle*
      - name: backend test
        working-directory: backend
        run: ./gradlew test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend lint + build
        working-directory: frontend
        run: npm ci && npm run lint && npm run build

  build-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: petcare-backend
            context: backend
          - name: petcare-web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/codevins/${{ matrix.name }}:latest
            ghcr.io/codevins/${{ matrix.name }}:sha-${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - name: compose 파일 복사 후 pull/up
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          OPTS="-i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new"
          scp $OPTS docker-compose.yml "$TARGET:petcare/docker-compose.yml"
          # 변경(2026-09-30): latest 대신 이 커밋의 sha 태그로 배포 — 실행된 커밋과 운영 이미지가 항상 일치
          # (이전: latest pull이라 태그 경쟁 시 다른 커밋 이미지가 뜰 수 있었음). 셸 TAG가 .env의 TAG보다 우선
          ssh $OPTS "$TARGET" "cd petcare && export TAG=sha-${{ github.sha }} && docker compose pull && docker compose up -d --no-build && docker image prune -f"
