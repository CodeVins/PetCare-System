name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: backend/*.gradle*
      - name: backend test
        working-directory: backend
        run: ./gradlew test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend lint + build
        working-directory: frontend
        run: npm ci && npm run lint && npm run build

  build-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: petcare-backend
            context: backend
          - name: petcare-web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/codevins/${{ matrix.name }}:latest
            ghcr.io/codevins/${{ matrix.name }}:sha-${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - name: compose 파일 복사 후 pull/up
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          OPTS="-i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new"
          scp $OPTS docker-compose.yml "$TARGET:petcare/docker-compose.yml"
          ssh $OPTS "$TARGET" 'cd petcare && docker compose pull && docker compose up -d --no-build && docker image prune -f'
