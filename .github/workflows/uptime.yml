# 운영 장애 감시 — 15분마다 헬스체크를 호출하고, 실패하면 이 워크플로가 실패로 끝나서 GitHub가 메일로 알려줌
# (별도 모니터링 서비스 가입 없이 레포 안에서 해결). 2026-10-02 EC2가 꺼져 있었는데 배포 실패 전까지 아무도 몰랐던 일 이후 추가
# ponytail: GitHub 스케줄은 정시에 안 돌고 몇 분씩 밀릴 수 있음, 레포에 60일간 활동이 없으면 스케줄이 자동으로 꺼짐
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: 헬스체크 (일시적 네트워크 문제는 재시도)
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 10 https://petcare-yongbin.duckdns.org/api/health | grep -q '"status":"UP"'; then
              echo "UP"; exit 0
            fi
            echo "시도 $i 실패, 20초 후 재시도"; sleep 20
          done
          echo "::error::운영 서버 헬스체크 실패 — EC2 인스턴스 상태와 docker compose ps를 확인하세요"
          exit 1
