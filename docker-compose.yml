# 운영(EC2: pull 후 up -d --no-build)과 로컬(up --build) 공용
services:
  mysql:
    image: mysql:8
    command: --performance-schema=OFF --innodb-buffer-pool-size=128M
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: petcare
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 변경(2026-09-30): localhost(소켓) → 127.0.0.1(TCP) — 첫 부팅 초기화용 임시 서버는 TCP를 안 열어서 진짜 서버가 뜬 뒤에만 healthy
      # (이전: 임시 서버에 ping이 통과해 backend가 재시작 중인 MySQL에 붙을 수 있었음)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # 로그인 실패 횟수 같은 휘발성 TTL 데이터만 — 영속화 끔(재시작 시 비워져도 무방). t3.micro(1GB)라 메모리 상한 고정
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    restart: unless-stopped

  # 하루 한 번 DB 덤프 + 업로드 사진 묶음을 서버 ~/petcare/backups에 7일치 보관 (시작할 때 한 번, 이후 24시간마다).
  # 이미 받아둔 mysql:8 이미지를 재사용해서 추가 다운로드 없음. 덤프 실패 시 임시 파일을 지워 깨진 백업이 남지 않게
  # ponytail: 같은 디스크라 인스턴스·디스크 자체를 잃으면 백업도 같이 잃음 — 그 경우는 EBS 스냅샷(docs/DEPLOY.md)으로 대비
  db-backup:
    image: mysql:8
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -o pipefail
        while true; do
          stamp=$$(date +%F)
          if mysqldump -h mysql -u "$$DB_USERNAME" --single-transaction --no-tablespaces petcare | gzip > /backups/db-$$stamp.sql.gz.tmp; then
            mv /backups/db-$$stamp.sql.gz.tmp /backups/db-$$stamp.sql.gz && echo "[backup] db-$$stamp.sql.gz ok"
          else
            rm -f /backups/db-$$stamp.sql.gz.tmp && echo "[backup] db dump FAILED"
          fi
          tar czf /backups/uploads-$$stamp.tar.gz -C /uploads . && echo "[backup] uploads-$$stamp.tar.gz ok"
          find /backups -name '*.gz' -mtime +6 -delete
          sleep 86400
        done
    environment:
      TZ: Asia/Seoul
      DB_USERNAME: ${DB_USERNAME}
      MYSQL_PWD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ghcr.io/codevins/petcare-backend:${TAG:-latest}
    build: ./backend
    # 변경(2026-09-30): env_file(.env 전체) → 필요한 키만 전달 — backend에 MySQL root 비밀번호가 넘어가지 않게
    # (이전: MYSQL_ROOT_PASSWORD·DOMAIN·TAG까지 컨테이너 환경변수로 노출)
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/petcare?allowPublicKeyRetrieval=true&useSSL=false
      SHOW_SQL: "false"
      REDIS_HOST: redis
    volumes:
      - uploads:/app/uploads
    # 변경(2026-10-02): redis 추가 — 시작만 되면 됨(헬스체크 대기 안 함, 연결 실패해도 로그인은 fail-open)
    # (이전: mysql만 의존)
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    image: ghcr.io/codevins/petcare-web:${TAG:-latest}
    build: ./frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:
