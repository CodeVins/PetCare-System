spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-secret-key-for-integration-tests-must-be-long-enough-1234567890
  expiration: 3600000
  refresh-expiration: 1209600000

app:
  upload:
    pet-image-dir: build/test-uploads
    hospital-image-dir: build/test-uploads-hospitals
  admin:
    bootstrap-email:
    bootstrap-password:
