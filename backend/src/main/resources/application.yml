spring:
  application:
    name: petcare

  datasource:
    # 변경(2026-09-30): URL을 환경변수 DB_URL로(기본값은 기존 로컬 주소) — 컨테이너에선 호스트명이 mysql (이전: localhost 하드코딩)
    url: ${DB_URL:jdbc:mysql://localhost:3306/petcare}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # 변경(2026-09-30): SHOW_SQL 환경변수로 끌 수 있게 — 운영 로그에 SQL 전부 찍히는 것 방지 (이전: 항상 true)
        format_sql: ${SHOW_SQL:true}
        # 변경(2026-09-27): 지연 로딩 연관을 IN 쿼리로 묶어서 N+1 완화 (이전: 미설정 — fetch join이 없어 리뷰 답글·예약→펫 등이 건별 조회)
        default_batch_fetch_size: 100
    show-sql: ${SHOW_SQL:true}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # Redis 장애 시 로그인 요청이 Lettuce 기본 타임아웃(60초)만큼 묶이지 않게 — LoginAttemptService가 fail-open 처리
      timeout: 1s
      connect-timeout: 1s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  # Caddy가 붙이는 X-Forwarded-Proto/Host 신뢰 — HTTPS 프록시 뒤에서 Swagger 서버 URL 등이 https로 만들어지게
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour (ms)
  refresh-expiration: 1209600000 # 14 days (ms)

app:
  upload:
    pet-image-dir: uploads/pets
    hospital-image-dir: uploads/hospitals
    review-image-dir: uploads/reviews
  # 운영 데모 데이터(가상 병원·슬롯·리뷰) — DEMO_SEED=true일 때만 global/demo/DemoDataSeeder가 동작
  demo:
    enabled: ${DEMO_SEED:false}
  admin:
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}

# 장애 감시용 헬스체크 — /api 아래에 둬서 운영 Caddy(/api/*)·Vite 프록시를 그대로 탐. health만 공개, 상세(DB 정보 등)는 숨김
# Redis는 장애 시 fail-open(로그인 제한·캐시만 꺼짐)이라 서비스 가용성과 무관 → 헬스 판정에서 제외해 오탐 방지
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
